<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <!-- Mosaico de la marca de agua PROTOTIPO (rojo, en diagonal). Se repite sobre toda la pantalla. -->
  <g transform="rotate(-28 210 150)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="210" y="120" font-size="46" letter-spacing="6" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="5" paint-order="stroke">PROTOTIPO</text>
    <text x="210" y="120" font-size="46" letter-spacing="6" fill="#e5172b" fill-opacity=".62">PROTOTIPO</text>
    <text x="0"   y="270" font-size="46" letter-spacing="6" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="5">PROTOTIPO</text>
    <text x="0"   y="270" font-size="46" letter-spacing="6" fill="#e5172b" fill-opacity=".62">PROTOTIPO</text>
    <text x="420" y="270" font-size="46" letter-spacing="6" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="5">PROTOTIPO</text>
    <text x="420" y="270" font-size="46" letter-spacing="6" fill="#e5172b" fill-opacity=".62">PROTOTIPO</text>
  </g>
</svg>
